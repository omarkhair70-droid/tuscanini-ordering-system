name: Tuscanini Rebirth — Install 100 Owner Food Visuals (Draft Branch Only)

on:
  push:
    branches:
      - redesign/tuscanini-authored-experience-20261018
    paths:
      - 'assets/intake/tuscanini-pass19-images.zip'

permissions:
  contents: write
  actions: write

concurrency:
  group: tuscanini-owner-ai-photo-intake
  cancel-in-progress: false

jobs:
  install-owner-food-photos:
    if: github.ref == 'refs/heads/redesign/tuscanini-authored-experience-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-only-public-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-only-service-placeholder
      NEXT_PUBLIC_REBIRTH_GENERATED_IMAGES: ready
      REBIRTH_BRANCH: redesign/tuscanini-authored-experience-20261018
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Strictly extract exactly 100 original owner-supplied optimized WebP images
        run: |
          python3 scripts/qa/install-generated-from-zip.py assets/intake/tuscanini-pass19-images.zip
          node scripts/qa/verify-generated-menu-media.mjs
      - name: Compile the website with the owner-generated photographs ACTIVE
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
      - name: Add only 100 AI-generated food image assets to this open Draft PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/rebirth/generated/
          changed=$(git diff --cached --name-only | wc -l | tr -d ' ')
          if [ "$changed" -ne 100 ]; then
            echo "Unexpected binary diff of $changed; only first-time 100-image admission permitted"
            exit 1
          fi
          git commit -m "assets(tuscanini): install 100 owner-generated illustrative food photo WebPs"
          git push origin "HEAD:${REBIRTH_BRANCH}"
      - name: Launch entire real Chromium/photo/motion QA with ALL 100 generated images enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run rebirth-visual-qa.yml --ref "${REBIRTH_BRANCH}"
          echo "QA dispatched. PR remains Draft; this workflow never deploys or merges."
