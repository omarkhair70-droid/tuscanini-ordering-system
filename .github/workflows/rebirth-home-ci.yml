name: Tuscanini Rebirth Home CI

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/images/rebirth/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/rebirth-home-ci.yml"
  push:
    branches:
      - "main"
      - "redesign/**"

permissions:
  contents: read

jobs:
  repair-security-lock-once:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'chore/tuscanini-20261026-security-runtime' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Patch vulnerable transitive dependencies without changing direct versions
        run: |
          npm audit fix --package-lock-only --ignore-scripts --no-fund --no-audit
          npm audit --omit=dev --audit-level=high
      - name: Commit audited lockfile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): patch vulnerable transitive dependencies"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
  typecheck-build:
    name: Typecheck & Next build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-only-public-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-only-service-placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Fail on high/critical production dependency advisories
        run: npm run audit:prod
      - name: Test concurrent admin order updates without a live database
        run: node scripts/qa/rebirth-order-concurrency-smoke.mjs
      - run: npx tsc --noEmit
      - name: ESLint security/quality audit
        run: npm run lint
      - run: npm run build
