name: Tuscanini Rebirth Home CI

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/images/rebirth/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/rebirth-home-ci.yml"
  push:
    branches:
      - "redesign/**"

jobs:
  typecheck-build:
    name: Typecheck & Next build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
