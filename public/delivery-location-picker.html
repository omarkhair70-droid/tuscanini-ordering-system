<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>حدّد مكان التوصيل | توسكانيني</title>
<!-- Leaflet renders HTML image tiles; unlike WebGL2-based MapLibre it works
     even when Android hardware acceleration / WebGL contexts are unavailable. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
 integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<style>
*{box-sizing:border-box}
:root{font-family:Tahoma,Arial,sans-serif;color:#171511}
body{margin:0;background:#fff9ee;height:100dvh;display:flex;flex-direction:column}
header{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 1px 8px #0001}
header strong{font-size:17px}
header span{color:#6b5b4d;font-size:12px}
#map{position:relative;flex:1;min-height:240px;background:#efe2ce}
#pin-message{position:absolute;z-index:3;left:12px;right:12px;top:12px;pointer-events:none;display:flex;justify-content:center}
#pin-message span{padding:10px 14px;background:#fff9ee;border-radius:13px;box-shadow:0 4px 15px #0002;font:700 13px/1.6 Tahoma,sans-serif}
footer{padding:12px 16px calc(14px + env(safe-area-inset-bottom));display:grid;gap:10px;background:#fff9ee;box-shadow:0 -3px 18px #0001}
#actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{border:1px solid #171511;min-height:49px;padding:10px 12px;font:700 14px Tahoma,sans-serif;cursor:pointer;border-radius:12px}
#locate{background:#fff9ee;color:#171511}
#confirm{background:#171511;color:#fff9ee}
#confirm:disabled{opacity:.43;cursor:not-allowed}
#coordinates{color:#64594b;font:700 12px/1.6 Tahoma,sans-serif;min-height:18px}
#external-map-link{color:#8f2420;font-weight:900;text-decoration:underline;text-underline-offset:3px}
#message{color:#b52220;font-size:12px;line-height:1.5;min-height:0;margin:0}
.location-privacy{font-size:10px;color:#695c4e;line-height:1.6;margin:0}
.leaflet-control-attribution{direction:ltr;font-size:10px!important}
.leaflet-container{font-family:Tahoma,Arial,sans-serif;background:#efe2ce}
.delivery-marker{width:34px;height:45px;position:relative;filter:drop-shadow(0 3px 3px #0006)}
.delivery-marker::before{content:"";position:absolute;top:3px;left:6px;width:24px;height:24px;
 background:#d72e26;border:3px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
.delivery-marker::after{content:"";position:absolute;top:12px;left:17px;width:7px;height:7px;
 background:#fff;border-radius:50%;transform:translateX(-50%)}
#pin-message{z-index:750}
#map:not(.leaflet-container){background:#efe2ce}
#map-loader{position:absolute;z-index:740;bottom:14px;left:12px;right:12px;
 background:#fff9ee;color:#46372d;padding:9px 12px;border-radius:10px;
 box-shadow:0 3px 18px #0002;text-align:center;font:700 12px/1.6 Tahoma,sans-serif}
#map-loader[hidden]{display:none}

@media(max-width:340px){header strong{font-size:14px}button{font-size:12px}}
</style>
</head>
<body>
<header><strong>فين نوصّل طلبك؟</strong><span>حرّك الدبوس أو اختار مكانك</span></header>
<div id="map">
  <div id="pin-message"><span>اضغط على المكان أو اسحب الدبوس</span></div>
  <div id="map-loader" role="status">بنحمّل الشوارع والمباني…</div>
</div>
<footer>
 <div id="coordinates" role="status" aria-live="polite">حدد مكان التوصيل على الخريطة</div>
 <p id="message" aria-live="polite"></p>
 <div id="actions"><button id="locate" type="button">موقعي الحالي</button><button id="confirm" type="button" disabled>اعتمد المكان</button></div>
 <p class="location-privacy">«موقعي الحالي» يطلب إذن الموقع ويستخدم خدمة خارجية لمعرفة المنطقة التقريبية فقط. عنوان الشارع والمدخل تكتبه بنفسك.</p>
</footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
 integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(function(){
  'use strict';
  var marker=null, map=null, selected=null, suggestedArea='';
  var tilesReady=false, tileErrors=0, fallbackTimer=null;
  var mapLoader=document.getElementById('map-loader');
  var message=document.getElementById('message'),coord=document.getElementById('coordinates');
  var confirm=document.getElementById('confirm');
  function valid(lat,lng){return Number.isFinite(lat)&&Number.isFinite(lng)&&lat>=22&&lat<=32&&lng>=24&&lng<=37;}
  function setPoint(lng,lat,isGps){
    if(!valid(lat,lng)){message.textContent='اختار مكان داخل مصر.';return;}
    selected={lat:+lat.toFixed(6),lng:+lng.toFixed(6)};
    if(!isGps)suggestedArea='';
    if(marker)marker.setLatLng([selected.lat,selected.lng]);
    coord.textContent=isGps?'✓ تم تحديد موقعك بالجهاز — راجع الدبوس واضبط المدخل':
      '✓ تم اختيار نقطة التوصيل — تأكد من المدخل قبل الاعتماد';
    confirm.disabled=false;
    message.textContent=map?'':'الـGPS حدد النقطة، لكن الخريطة مش متاحة. راجع الإحداثيات على خرائط جوجل قبل الاعتماد.';
    updateMapLink();
  }
  function updateMapLink(){
    var old=document.getElementById('external-map-link');
    if(old)old.remove();
    if(!selected)return;
    var link=document.createElement('a');
    link.id='external-map-link';link.target='_blank';link.rel='noopener noreferrer';
    link.href='https://www.google.com/maps/search/?api=1&query='+
      selected.lat+','+selected.lng;
    link.textContent='راجع النقطة على خرائط جوجل ↗';
    document.getElementById('coordinates').appendChild(document.createTextNode(' · '));
    document.getElementById('coordinates').appendChild(link);
  }
  function tilesVisible(){
    if(tilesReady)return;
    tilesReady=true;
    if(fallbackTimer)window.clearTimeout(fallbackTimer);
    if(mapLoader)mapLoader.hidden=true;
    if(!selected)message.textContent='';
  }
  function showMapFallback(){
    if(tilesReady)return;
    if(mapLoader)mapLoader.textContent='شبكة الشوارع مش بتتحمّل على الجهاز. تقدر تراجع نقطة GPS في خرائط جوجل من الرابط تحت.';
    message.textContent='عرض الشوارع غير متاح دلوقتي. لو النقطة اتحددت، افتحها على خرائط جوجل واضبط مكان المدخل.';
  }
  try {
    if(!window.L)throw new Error('leaflet-library-unavailable');
    map=L.map('map',{
      center:[29.072,31.099],zoom:13,
      zoomControl:false,scrollWheelZoom:false,
      attributionControl:true,preferCanvas:false,
      maxZoom:19
    });
    L.control.zoom({position:'topleft'}).addTo(map);
    var tiles=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
      attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap contributors</a>',
      maxZoom:19,subdomains:[''],crossOrigin:true,updateWhenIdle:true
    }).addTo(map);
    tiles.on('tileload',tilesVisible);
    tiles.on('tileerror',function(){
      tileErrors++;
      if(tileErrors>=4&&!tilesReady)showMapFallback();
    });
    // The HTML marker needs no external PNG assets and stays draggable on
    // Android even when the CDN cannot fetch icon graphics.
    marker=L.marker([29.072,31.099],{
      draggable:true,keyboard:true,autoPan:true,
      icon:L.divIcon({className:'delivery-marker',iconSize:[36,47],iconAnchor:[18,47]})
    }).addTo(map);
    var markerElement=marker.getElement();
    if(markerElement){
      markerElement.setAttribute('aria-label','دبوس التوصيل؛ استخدم الأسهم لتحريكه، أو اسحبه باللمس');
      markerElement.setAttribute('role','button');
      markerElement.addEventListener('keydown',function(event){
        var steps={ArrowUp:[0,1],ArrowDown:[0,-1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
        var direction=steps[event.key];
        if(!direction)return;
        event.preventDefault();
        var current=marker.getLatLng(),step=event.shiftKey?0.001:0.00015;
        var lng=current.lng+direction[0]*step,lat=current.lat+direction[1]*step;
        setPoint(lng,lat);
        map.panTo([lat,lng],{animate:false});
      });
    }
    marker.on('dragend',function(){var pos=marker.getLatLng();setPoint(pos.lng,pos.lat);});
    map.on('click',function(e){setPoint(e.latlng.lng,e.latlng.lat);});
    fallbackTimer=window.setTimeout(showMapFallback,10000);
    // The iframe starts inside a <dialog> (initially hidden). Recompute tile
    // dimensions whenever modal becomes visible or GPS shifts the viewpoint.
    map.whenReady(function(){
      // The map is mounted in a dialog which may still be closed. Observe
      // the first visible viewport size, not just document readiness.
      if('ResizeObserver' in window){
        new ResizeObserver(function(){map.invalidateSize({animate:false});})
          .observe(document.getElementById('map'));
      }
      window.setTimeout(function(){map.invalidateSize({animate:false});},100);
    });
  }catch(e){
    if(mapLoader)mapLoader.textContent='الخريطة مش متاحة على جهازك. استخدم الدبوس من GPS وراجع النقطة في خرائط جوجل.';
    message.textContent='تعذر عرض شبكة الشوارع هنا. ممكن تكمل بالدبوس والعنوان المكتوب، بعد مراجعة المكان في خرائط جوجل.';
    map=null;
  }
  var locateButton=document.getElementById('locate');
  if(window.parent!==window){
    // The parent has a prominent GPS button, so the map footer should focus
    // on the ONE final action rather than repeating the same location CTA.
    locateButton.hidden=true;
    document.getElementById('actions').style.gridTemplateColumns='1fr';
  }
  var pendingLocationRequest=null;
  function showPosition(result){
    if(!result||result.status==='retrying'){
      message.textContent='بنجرّب نحدد مكانك عن طريق الشبكة…';
      return;
    }
    if(result.status==='area'){
      var suggested=typeof result.area==='string'?result.area.trim().slice(0,130):'';
      if(suggested&&selected&&
         Math.abs(selected.lat-Number(result.lat))<0.000002&&
         Math.abs(selected.lng-Number(result.lng))<0.000002){
        suggestedArea=suggested;
        message.textContent='المنطقة المقترحة: '+suggested+
          ' — لسه محتاجين رقم العمارة والمدخل.';
      }
      return;
    }
    locateButton.disabled=false;
    pendingLocationRequest=null;
    if(result.status==='ok'){
      var lat=Number(result.lat),lng=Number(result.lng),accuracy=Number(result.accuracy);
      if(!valid(lat,lng)){message.textContent='الموقع خارج نطاق مصر؛ حدّد المكان بإيدك.';return;}
      setPoint(lng,lat,true);
      if(map){map.invalidateSize();map.setView([lat,lng],17,{animate:false});}
      if(Number.isFinite(accuracy)&&accuracy>100){
        message.textContent='الموقع التقريبي دقته حوالي '+Math.ceil(accuracy)+' متر؛ حرّك الدبوس لمدخل العمارة قبل الاعتماد.';
      }else{
        message.textContent='حددنا مكانك. راجع الدبوس على مدخل العمارة قبل اعتماده.';
      }
      return;
    }
    var errors={
      denied:'إذن الموقع مقفول في المتصفح أو الجهاز. فعّله من علامة القفل في شريط العنوان، أو اضغط على الخريطة وحدد الدبوس بنفسك.',
      timeout:'تحديد موقعك استغرق وقتًا طويلًا. جرّب من جديد أو اختر الدبوس بنفسك.',
      outside:'الموقع المحدد خارج نطاق مصر. اختار نقطة داخل مصر من الخريطة.',
      unsupported:'الجهاز أو المتصفح لا يسمح بالتحديد التلقائي. استخدم الدبوس على الخريطة.',
      unavailable:'تعذر الوصول إلى خدمة تحديد الموقع. حرّك الدبوس واضغط «اعتمد المكان».'
    };
    message.textContent=errors[result.status]||'تحديد الموقع التلقائي غير متاح حاليًا. استخدم دبوس الخريطة.';
  }
  // Only trust the same-origin parent checkout; this protects user location
  // against arbitrary messages from other windows.
  window.addEventListener('message',function(event){
    if(event.origin!==window.location.origin||event.source!==window.parent)return;
    var data=event.data;
    if(!data||data.version!==1||data.type!=='tuscanini:delivery-location:result')return;
    if(data.requestId!=='parent'&&data.requestId!==pendingLocationRequest)return;
    showPosition(data);
  });
  locateButton.addEventListener('click',function(){
    if(pendingLocationRequest)return;
    locateButton.disabled=true;
    message.textContent='بنطلب موقعك من المتصفح…';
    if(window.parent!==window){
      pendingLocationRequest='gps_'+Math.random().toString(36).slice(2)+Date.now().toString(36);
      window.parent.postMessage({
        type:'tuscanini:delivery-location:request',version:1,
        requestId:pendingLocationRequest
      },window.location.origin);
      // If a parent is not listening, do not trap the customer in a spinner.
      window.setTimeout(function(){
        if(!pendingLocationRequest)return;
        pendingLocationRequest=null;locateButton.disabled=false;
        message.textContent='تعذر الاتصال بخدمة الموقع؛ اضغط على الخريطة وحدد دبوس التوصيل بنفسك.';
      },27000);
      return;
    }
    // Standalone picker can still be used directly in a tab.
    if(!navigator.geolocation){showPosition({status:'unsupported'});return;}
    navigator.geolocation.getCurrentPosition(function(p){
      showPosition({status:'ok',lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy});
    },function(e){showPosition({status:e.code===1?'denied':e.code===3?'timeout':'unavailable'});},
    {enableHighAccuracy:false,timeout:14000,maximumAge:30000});
  });
  confirm.addEventListener('click',function(){
    if(!selected||!valid(selected.lat,selected.lng))return;
    if(window.parent!==window)window.parent.postMessage({
      type:'tuscanini:delivery-pin:selected',version:1,
      lat:selected.lat,lng:selected.lng,area:suggestedArea
    },window.location.origin);
  });
})();
</script>
</body>
</html>
